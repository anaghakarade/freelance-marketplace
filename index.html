<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: http: wss: ws:;"
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('workstream-theme') || 'system';
          var activeTheme = theme;
          if (theme === 'system') {
            activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', activeTheme);
          
          var motion = localStorage.getItem('workstream-motion');
          if (motion === 'reduced' || (!motion && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            document.documentElement.classList.add('reduced-motion');
          }
        } catch (e) {
          console.warn('Theme setup failed:', e);
        }
      })();
    </script>
