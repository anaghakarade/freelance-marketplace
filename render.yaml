# ==============================================================================
# WorkStream — Infrastructure as Code Deployment Blueprint (Render)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: workstream-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o bin/server ./cmd/server && go build -o bin/migrate ./cmd/migrate
    startCommand: ./bin/migrate up && ./bin/server
    healthCheckPath: /api/health
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workstream-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: workstream-frontend
          property: url

  # ----------------------------------------------------------------------------
  # Frontend React SPA Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: workstream-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: workstream-backend
          property: url
          postfix: /api

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: workstream-db
    databaseName: workstream
    user: workstream
    plan: free
    region: oregon
    postgresMajorVersion: 15
